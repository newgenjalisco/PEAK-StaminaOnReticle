## Stamina On Reticle - quick settings
##
## You can edit this file with Notepad (or any text editor): change the value
## after the "=" sign, save the file, and start the game.
##
## Colours are hexadecimal in the form #RRGGBB or #RRGGBBAA.
## Booleans are written as true or false.
##
## The values shown below are the defaults.

[General]

## Show the ring around the crosshair. true = on, false = off.
Enabled = true

## Fade the ring out while stamina is at its maximum.
Hide When Full = false

## Draw the outer ring for morale-boost (extra) stamina.
Show Extra Stamina = true

## Draw the active status effects as coloured arcs on the ring.
Show Stats = true

## Pulse the ring when stamina is low (automatically disabled by the in-game
## photosensitivity setting).
Pulse When Low = true

## Stamina ratio below which the ring uses the low colour. Range 0.0 to 1.0.
Low Stamina Threshold = 0.25

[Layout]

## Outer diameter of the stamina ring, in pixels at 1080p.
Diameter = 46

## Line thickness of the stamina ring, in pixels at 1080p.
Thickness = 3.5

## Line thickness of the extra-stamina ring, in pixels at 1080p.
Extra Thickness = 2.5

## Horizontal screen offset, in pixels at 1080p. Positive moves right.
Offset X = 0

## Vertical screen offset, in pixels at 1080p. Positive moves up.
Offset Y = 0

[Colors]

## Colour of the ring at full stamina.
Full Color = #4CD137

## Colour of the ring when stamina is low.
Low Color = #4CD137

## Colour of the outer extra-stamina ring.
Extra Color = #8CE06A

## Colour of the small dot in the middle of the ring.
Center Color = #EAFFE6

## Colour of the dim ring behind the stamina fill.
Track Color = #00000059
